name: CardDealRhythmWallclockV4
options:
  bundleIdPrefix: com.tobc.reviews
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  CardDealRhythmWallclockV4:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobc.reviews.card-deal-rhythm-wallclock-v4
        PRODUCT_NAME: CardDealRhythmWallclockV4
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Deal Rhythm V4
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
  CardDealRhythmWallclockV4Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CardDealRhythmWallclockV4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobc.reviews.card-deal-rhythm-wallclock-v4.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  CardDealRhythmWallclockV4:
    build:
      targets:
        CardDealRhythmWallclockV4: all
        CardDealRhythmWallclockV4Tests: [test]
    test:
      targets:
        - CardDealRhythmWallclockV4Tests
    run:
      config: Debug
