name: CardMotionMaterialLockV5
options:
  bundleIdPrefix: com.tobc.reviews
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  CardMotionMaterialLockV5:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobc.reviews.card-motion-material-lock-v5
        PRODUCT_NAME: CardMotionMaterialLockV5
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Card Material Lock V5
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
  CardMotionMaterialLockV5Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CardMotionMaterialLockV5
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobc.reviews.card-motion-material-lock-v5.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  CardMotionMaterialLockV5:
    build:
      targets:
        CardMotionMaterialLockV5: all
        CardMotionMaterialLockV5Tests: [test]
    test:
      targets:
        - CardMotionMaterialLockV5Tests
    run:
      config: Debug
