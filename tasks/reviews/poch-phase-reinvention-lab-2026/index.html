<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>POCH 1441 - Phasenlabor 2026</title>
  <style>
    :root {
      --ink: #07080c;
      --lift: #11141c;
      --paper: #f0ece4;
      --muted: #858b99;
      --gold: #d2ab5c;
      --rose: #d64c69;
      --emerald: #38ba93;
      --amethyst: #9f6ae8;
      --cyan: #53d9ff;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    }

    * { box-sizing: border-box; }
    html { background: #090a0e; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--paper);
      background:
        radial-gradient(circle at 10% -10%, rgba(83, 217, 255, 0.11), transparent 34rem),
        radial-gradient(circle at 90% 0%, rgba(214, 76, 105, 0.1), transparent 32rem),
        #090a0e;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .lab-header {
      position: sticky;
      top: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto minmax(180px, 1fr);
      align-items: center;
      gap: 20px;
      min-height: 76px;
      padding: 12px 24px;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(9,10,14,.82);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
      backdrop-filter: blur(18px) saturate(1.3);
    }

    .lab-brand { display: flex; align-items: baseline; gap: 8px; letter-spacing: -.03em; }
    .lab-brand strong { font-size: 18px; letter-spacing: -.04em; }
    .lab-brand span { color: var(--gold); font-size: 15px; }
    .lab-kicker { justify-self: end; color: var(--muted); font-size: 11px; letter-spacing: .15em; text-transform: uppercase; }

    .chapter-tabs {
      display: flex;
      gap: 3px;
      padding: 4px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 14px;
      background: rgba(255,255,255,.04);
    }

    .chapter-tab {
      min-height: 38px;
      padding: 0 15px;
      border: 0;
      border-radius: 10px;
      color: #8f94a0;
      background: transparent;
      cursor: pointer;
      transition: color 150ms ease-out, background-color 150ms ease-out, transform 120ms ease-out;
    }
    .chapter-tab:active { transform: scale(.97); }
    .chapter-tab[aria-selected="true"] { color: #0b0c10; background: var(--paper); }

    .lab-main {
      display: grid;
      grid-template-columns: minmax(230px, 310px) minmax(390px, 1fr) minmax(230px, 310px);
      align-items: start;
      gap: clamp(22px, 4vw, 64px);
      width: min(1480px, 100%);
      margin: 0 auto;
      padding: 34px 28px 120px;
    }

    .concept-panel {
      position: sticky;
      top: 112px;
      padding-top: 18px;
    }
    .eyebrow { color: var(--cyan); font-size: 10px; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
    .concept-panel h1 { margin: 12px 0 8px; font-size: clamp(30px, 3vw, 48px); line-height: .95; letter-spacing: -.055em; }
    .concept-axis { margin: 0; color: #aeb3be; font-size: 15px; line-height: 1.5; }
    .concept-number { margin-top: 32px; color: rgba(255,255,255,.13); font-size: 78px; font-weight: 800; line-height: .8; letter-spacing: -.08em; }

    .phone-wrap { display: grid; place-items: start center; }
    .phone {
      position: relative;
      width: min(390px, calc(100vw - 28px));
      aspect-ratio: 390 / 844;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 48px;
      background: #090b10;
      box-shadow: 0 42px 110px rgba(0,0,0,.58), 0 0 0 8px rgba(255,255,255,.025);
      container-type: inline-size;
    }
    #stage, #stage > .game { width: 100%; height: 100%; }
    #stage { background: #090b10; }

    .decision-panel { color: #aeb3be; font-size: 13px; line-height: 1.55; }
    .decision-panel dl { margin: 18px 0 0; }
    .decision-panel dt { margin-top: 18px; color: #fff; font-size: 10px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; }
    .decision-panel dd { margin: 5px 0 0; }
    .tradeoff { color: #e2a0ad; }
    .gesture-note {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-top: 24px;
      padding: 8px 10px;
      border: 1px solid rgba(83,217,255,.22);
      border-radius: 999px;
      color: #a9eaff;
      background: rgba(83,217,255,.06);
      font-size: 11px;
    }

    .game {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 24px 18px 18px;
      background:
        radial-gradient(circle at 50% 28%, rgba(255,255,255,.06), transparent 32%),
        linear-gradient(180deg, #11141c, #07080c 72%);
      color: #f1f2f5;
    }
    .game::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .22;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }
    .game-top { display: flex; align-items: center; justify-content: space-between; min-height: 42px; }
    .wordmark { display: flex; gap: 5px; align-items: baseline; font-size: 17px; font-weight: 850; letter-spacing: -.035em; }
    .wordmark span { color: var(--gold); font-weight: 500; }
    .act-tag { color: var(--muted); font-size: 9px; font-weight: 780; letter-spacing: .16em; text-transform: uppercase; }
    .round-chip { padding: 6px 9px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; color: #c8cbd2; font-size: 10px; }
    .game-title { margin: 10px 0 2px; font-size: 27px; line-height: 1; letter-spacing: -.045em; }
    .game-subtitle { margin: 0; color: #8f95a2; font-size: 11px; line-height: 1.45; }

    .glass {
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.025));
      box-shadow: 0 20px 50px rgba(0,0,0,.3), inset 0 1px rgba(255,255,255,.1);
      -webkit-backdrop-filter: blur(16px) saturate(1.25);
      backdrop-filter: blur(16px) saturate(1.25);
    }
    .action {
      min-height: 48px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 16px;
      color: #f4f4f6;
      background: rgba(255,255,255,.075);
      cursor: pointer;
      transition: transform 130ms ease-out, background-color 160ms ease-out, border-color 160ms ease-out, color 160ms ease-out, opacity 160ms ease-out;
    }
    .action:active { transform: scale(.97); }
    .action.primary { color: #0a0b0e; background: var(--gold); border-color: #f0cb80; font-weight: 800; }
    .action.amethyst { background: #5e3b83; border-color: #a77bda; }
    .action.emerald { color: #06110e; background: #55c4a4; border-color: #91e5cb; font-weight: 800; }
    .action[disabled] { opacity: .38; cursor: not-allowed; }

    .card {
      position: relative;
      display: grid;
      align-content: space-between;
      width: 52px;
      height: 78px;
      padding: 7px;
      border: 1px solid #d6d0c7;
      border-radius: 9px;
      color: #111318;
      background: linear-gradient(145deg, #fffdf6, #d8d4cc);
      box-shadow: 0 10px 18px rgba(0,0,0,.34);
      font-family: ui-serif, Georgia, serif;
      font-size: 17px;
      font-weight: 800;
      line-height: .85;
      transform-origin: bottom center;
    }
    button.card { cursor: pointer; transition: transform 160ms var(--ease-out), box-shadow 160ms ease-out, opacity 160ms ease-out; }
    button.card:active { transform: translateY(2px) scale(.97); }
    .card.red { color: #b32c42; }
    .card .suit { justify-self: end; font-size: 22px; }
    .card.selected { box-shadow: 0 0 0 2px var(--gold), 0 12px 28px rgba(210,171,92,.32); transform: translateY(-8px); }
    .card.played { opacity: .18; transform: translateY(-16px) scale(.92); pointer-events: none; }
    .hand { display: flex; justify-content: center; align-items: end; min-height: 92px; }
    .hand .card { margin-left: -15px; }
    .hand .card:first-child { margin-left: 0; }
    .hand .card:nth-child(odd) { transform: rotate(-3deg); }
    .hand .card:nth-child(even) { transform: rotate(3deg); }
    .hand .card.selected { transform: translateY(-8px) rotate(0deg); }

    .opponents { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; }
    .opponent { display: grid; justify-items: center; flex: 1; color: #9ba0ac; font-size: 9px; }
    .avatar {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-bottom: 5px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50%;
      color: #f3e9d5;
      background: radial-gradient(circle at 38% 30%, #6c6578, #201d2a 68%);
      box-shadow: 0 6px 16px rgba(0,0,0,.3);
      font-size: 13px;
      font-weight: 800;
    }

    .token { width: 25px; height: 25px; border: 2px solid rgba(255,255,255,.35); border-radius: 50%; background: radial-gradient(circle at 34% 28%, #f0d48f, #a77528 67%); box-shadow: 0 6px 12px rgba(0,0,0,.36); }
    .token.purple { background: radial-gradient(circle at 34% 28%, #c49cf5, #5c327f 67%); }
    .token.green { background: radial-gradient(circle at 34% 28%, #8edfc4, #24755e 67%); }

    /* Splash directions */
    .splash { padding: 0; }
    .splash .game-top { position: absolute; inset: 28px 20px auto; z-index: 8; }
    .splash-copy { position: absolute; z-index: 7; left: 24px; right: 24px; bottom: 34px; }
    .splash-copy h2 { margin: 0 0 7px; max-width: 320px; font-size: 36px; line-height: .92; letter-spacing: -.055em; }
    .splash-copy p { margin: 0 0 14px; max-width: 300px; color: #c5c7ce; font-size: 12px; line-height: 1.4; }
    .splash-copy .action { width: 100%; }
    .splash-art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .splash-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.18), transparent 34%, rgba(5,6,9,.93) 88%); }

    .scratch-board { position: absolute; inset: 0; touch-action: none; }
    .scratch-board canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
    .scratch-progress { position: absolute; z-index: 8; top: 80px; left: 22px; color: #e9d8b7; font: 700 9px/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }

    .knock-world { position: absolute; inset: 0; background: #0b0a0b url('assets/02-four-knocks.webp') center/cover; }
    .knock-world::after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 54%, transparent, rgba(0,0,0,.78) 74%); }
    .knock-grid { position: absolute; z-index: 5; inset: 120px 22px 210px; display: grid; grid-template: 1fr 1fr / 1fr 1fr; gap: 12px; }
    .knock {
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50%;
      color: #fff;
      background: rgba(6,7,10,.36);
      cursor: pointer;
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      transition: transform 160ms var(--ease-out), background-color 180ms ease-out, border-color 180ms ease-out;
    }
    .knock:active { transform: scale(.94); }
    .knock.done { color: #09100e; background: #74d8b6; border-color: #adf3da; }
    .knock-count { font-size: 9px; letter-spacing: .16em; text-transform: uppercase; }

    .trailer-world { position: absolute; inset: 0; background: url('assets/03-playable-trailer-veto.webp') center/cover; }
    .trailer-world::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.08) 45%,rgba(0,0,0,.9)); }
    .swipe-card { position: absolute; z-index: 6; left: calc(50% - 56px); bottom: 192px; width: 112px; height: 164px; touch-action: none; transition: transform 220ms var(--ease-out), opacity 180ms ease-out; }
    .swipe-card .card { width: 112px; height: 164px; padding: 12px; border-radius: 15px; font-size: 28px; }
    .swipe-card.launched { transform: translate3d(280px,-180px,0) rotate(26deg); opacity: 0; }
    .trailer-outcome { position: absolute; z-index: 5; inset: 136px 22px 250px; display: grid; place-items: center; opacity: 0; transform: scale(.96); transition: opacity 200ms ease-out, transform 220ms var(--ease-out); }
    .trailer-outcome.revealed { opacity: 1; transform: scale(1); }
    .trailer-orbit { width: 230px; height: 230px; border: 1px solid #dd4968; border-radius: 50%; box-shadow: inset 0 0 55px rgba(214,76,105,.22), 0 0 34px rgba(214,76,105,.18); }

    .portraits-world { position: absolute; inset: 0; background: url('assets/04-living-portraits.webp') center/cover; }
    .portraits-world::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(6,5,8,.1),rgba(8,9,14,.92) 74%); }
    .portrait-row { position: absolute; z-index: 7; left: 17px; right: 17px; bottom: 205px; display: flex; gap: 8px; }
    .living-portrait { flex: 1; min-height: 138px; padding: 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 22px; color: #ddd; background: rgba(9,9,13,.55); cursor: pointer; transition: transform 180ms var(--ease-out), background-color 180ms ease-out, border-color 180ms ease-out; }
    .living-portrait:active { transform: scale(.97); }
    .living-portrait .avatar { width: 58px; height: 58px; margin: 0 auto 8px; filter: grayscale(1); transition: filter 220ms ease-out, transform 220ms var(--ease-out); }
    .living-portrait.awake { background: rgba(17,45,41,.7); border-color: rgba(87,221,181,.5); }
    .living-portrait.awake .avatar { filter: grayscale(0); transform: translateY(-3px); }

    .jump-world { position: absolute; inset: 0; background: url('assets/05-graphic-time-jump.webp') center/cover; transition: filter 240ms ease-out; }
    .jump-world[data-era="1441"] { filter: sepia(.65) saturate(.7) brightness(.58); }
    .jump-world[data-era="1900"] { filter: sepia(.22) saturate(.8) brightness(.72); }
    .jump-world[data-era="2026"] { filter: contrast(1.05) saturate(1.08); }
    .jump-world[data-era="next"] { filter: hue-rotate(155deg) saturate(1.45) contrast(1.15); }
    .era-control { position:absolute; z-index:8; left:24px; right:24px; bottom:196px; padding:16px; border-radius:20px; }
    .era-control output { display:block; margin-bottom:10px; color:#fff; font-size:30px; font-weight:850; letter-spacing:-.04em; }
    .era-control input { width:100%; accent-color:var(--rose); }
    .era-labels { display:flex; justify-content:space-between; color:#aeb2bc; font-size:9px; }

    /* Phase 1 */
    .phase1 { --phase: var(--gold); }
    .phase1 .game-title { color:#f5e7c6; }
    .constellation { position: relative; height: 348px; margin-top: 18px; }
    .constellation::before { content:""; position:absolute; inset:20px 8px 34px; background:conic-gradient(from 12deg at 50% 50%, transparent 0 9%, rgba(210,171,92,.22) 10% 11%, transparent 12% 27%, rgba(210,171,92,.18) 28% 29%, transparent 30%); border:1px solid rgba(210,171,92,.14); border-radius:50%; box-shadow:inset 0 0 60px rgba(210,171,92,.05); }
    .star-node { position:absolute; display:grid; place-items:center; width:64px; height:64px; border:1px solid rgba(210,171,92,.35); border-radius:50%; color:#e9d4a7; background:#121116; cursor:pointer; transition:transform 160ms var(--ease-out), background-color 180ms ease-out, box-shadow 180ms ease-out; }
    .star-node:active { transform:scale(.96); }
    .star-node.selected { color:#10100f; background:var(--gold); box-shadow:0 0 30px rgba(210,171,92,.35); }
    .star-node:nth-child(1){left:12px;top:108px}.star-node:nth-child(2){left:90px;top:22px}.star-node:nth-child(3){right:90px;top:22px}.star-node:nth-child(4){right:12px;top:108px}.star-node:nth-child(5){left:90px;bottom:22px}.star-node:nth-child(6){right:90px;bottom:22px}.star-node:nth-child(7){left:calc(50% - 38px);top:132px;width:76px;height:76px}
    .meld-footer { position:absolute; left:18px; right:18px; bottom:18px; display:grid; grid-template-columns:1fr 1.35fr; gap:8px; }

    .layers-stage { position:relative; height:430px; margin-top:10px; perspective:700px; }
    .layer-disc { position:absolute; left:50%; width:260px; height:160px; margin-left:-130px; border:1px solid rgba(255,255,255,.22); border-radius:50%; transform:rotateX(62deg); box-shadow:0 22px 34px rgba(0,0,0,.38); transition:transform 240ms var(--ease-in-out), opacity 200ms ease-out; }
    .layer-disc:nth-child(1){top:28px;background:rgba(89,217,255,.12)}
    .layer-disc:nth-child(2){top:96px;background:rgba(159,106,232,.16)}
    .layer-disc:nth-child(3){top:164px;background:rgba(210,171,92,.18)}
    .layers-stage[data-lift="2"] .layer-disc:nth-child(1){transform:translateY(-18px) rotateX(62deg)}
    .layers-stage[data-lift="3"] .layer-disc:nth-child(1){transform:translateY(-34px) rotateX(62deg)}
    .layers-stage[data-lift="3"] .layer-disc:nth-child(2){transform:translateY(-16px) rotateX(62deg)}
    .layer-label { position:absolute; inset:auto 18px 12px; padding:13px; border-radius:16px; color:#cad0dd; font-size:11px; }
    .layer-slider { position:absolute; right:-25px; top:160px; width:170px; transform:rotate(-90deg); accent-color:var(--cyan); }

    .evidence-desk { margin-top:16px; padding:14px; border:1px solid rgba(255,255,255,.12); border-radius:24px; background:linear-gradient(145deg,#24211d,#0d0e12); }
    .evidence-trump { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; border-bottom:1px dashed rgba(255,255,255,.16); }
    .evidence-slots { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
    .evidence-slot { min-height:104px; padding:11px; border:1px dashed rgba(255,255,255,.18); border-radius:14px; color:#9fa4af; background:rgba(0,0,0,.16); cursor:pointer; transition:background-color 180ms ease-out,border-color 180ms ease-out,transform 150ms ease-out; }
    .evidence-slot:active{transform:scale(.98)}.evidence-slot.marked{color:#13100a;background:#d7b66f;border-color:#ffe4aa}.evidence-slot strong{display:block;margin-bottom:5px;color:inherit;font-size:13px}
    .receipt { margin-top:10px; padding:10px 12px; border-radius:10px; color:#1a1712; background:#ddd5c6; font:700 10px/1.4 ui-monospace,monospace; }

    .hand-theatre { position:relative; height:455px; margin-top:10px; overflow:hidden; border-radius:28px; background:radial-gradient(ellipse at 50% 15%,rgba(210,171,92,.28),transparent 35%),linear-gradient(180deg,#1d1510,#09090c); }
    .curtain { position:absolute; top:0; bottom:0; width:72px; background:linear-gradient(90deg,#4b1421,#1c0c12); box-shadow:inset -8px 0 18px rgba(0,0,0,.32); }
    .curtain.left{left:0}.curtain.right{right:0;transform:scaleX(-1)}
    .theatre-hero { position:absolute; inset:86px 60px auto; text-align:center; }
    .theatre-hero .card { margin:auto; width:82px; height:120px; font-size:25px; }
    .theatre-picks { position:absolute; left:20px; right:20px; bottom:24px; display:flex; gap:8px; }
    .theatre-picks .action { flex:1; font-size:11px; }

    .lens-stage { position:relative; height:455px; margin-top:10px; border:1px solid rgba(255,255,255,.12); border-radius:30px; overflow:hidden; background:#0a0c12; }
    .lens-pane { position:absolute; inset:0; padding:22px; }
    .lens-pane.payout { clip-path:inset(0 0 0 50%); background:radial-gradient(circle at 70% 35%,rgba(210,171,92,.25),transparent 34%); }
    .lens-divider { position:absolute; z-index:4; top:0; bottom:0; left:50%; width:2px; background:#fff; box-shadow:0 0 18px rgba(255,255,255,.7); }
    .lens-knob { position:absolute; z-index:5; left:calc(50% - 23px); top:205px; display:grid; place-items:center; width:46px; height:46px; border:1px solid #fff; border-radius:50%; color:#0b0c10; background:#fff; cursor:ew-resize; }
    .lens-control { position:absolute; z-index:6; left:24px; right:24px; bottom:18px; accent-color:var(--gold); }

    /* Phase 2 */
    .phase2 { --phase:var(--amethyst); background:radial-gradient(circle at 50% 30%,rgba(159,106,232,.14),transparent 35%),linear-gradient(180deg,#11101a,#07080c 75%); }
    .phase2::before, .phase3::before {
      position:absolute;
      z-index:3;
      left:18px;
      right:18px;
      bottom:18px;
      min-height:50px;
      padding:10px 14px 10px 56px;
      border:1px solid rgba(255,255,255,.1);
      border-radius:17px;
      color:#afb4bf;
      background:
        linear-gradient(135deg, transparent 0 30px, rgba(255,255,255,.05) 31px),
        rgba(8,9,13,.88);
      box-shadow:0 16px 30px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.05);
      font-size:9px;
      font-weight:750;
      line-height:28px;
      letter-spacing:.12em;
      text-transform:uppercase;
      pointer-events:none;
    }
    .phase2::before { content:"DEINE HAND  ·  10♣ 10♦  ·  18 CHIPS"; border-color:rgba(159,106,232,.18); }
    .phase3::before { content:"DEINE HAND  ·  4 KARTEN  ·  TRUMPF ♥"; border-color:rgba(56,186,147,.18); }
    .phase2::after, .phase3::after {
      z-index:2;
      opacity:.32;
    }

  <script>
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const card = (rank, suit, classes = '', attrs = '') => `<button class="card ${'♥♦'.includes(suit) ? 'red' : ''} ${classes}" ${attrs} aria-label="${rank} ${suit}"><span>${rank}${suit}</span><span class="suit">${suit}</span></button>`;
    const staticCard = (rank, suit, classes = '') => `<div class="card ${'♥♦'.includes(suit) ? 'red' : ''} ${classes}" aria-hidden="true"><span>${rank}${suit}</span><span class="suit">${suit}</span></div>`;
    const gameTop = (act, round = 'Runde 4 · 36') => `<div class="game-top"><div class="wordmark">POCH <span>1441</span></div><div class="act-tag">${act}</div><div class="round-chip">${round}</div></div>`;
    const opponents = () => `<div class="opponents"><div class="opponent"><span class="avatar">N</span>Noah · wach</div><div class="opponent"><span class="avatar">H</span>Hana · prüft</div><div class="opponent"><span class="avatar">J</span>Jonas · ruhig</div></div>`;

    function wireScratch() {
      const board = stage.querySelector('.scratch-board');
      const canvas = board?.querySelector('canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const drawCover = () => {
        const rect = board.getBoundingClientRect();
        canvas.width = Math.round(rect.width * devicePixelRatio);
        canvas.height = Math.round(rect.height * devicePixelRatio);
        ctx.scale(devicePixelRatio, devicePixelRatio);
        const gradient = ctx.createLinearGradient(0,0,rect.width,rect.height);
        gradient.addColorStop(0,'#17110e'); gradient.addColorStop(.48,'#0c0b0c'); gradient.addColorStop(1,'#142026');
        ctx.fillStyle = gradient; ctx.fillRect(0,0,rect.width,rect.height);
        ctx.strokeStyle = 'rgba(210,171,92,.28)'; ctx.lineWidth = 1;
        for (let y=110;y<rect.height-160;y+=42){ctx.beginPath();ctx.moveTo(24,y);ctx.lineTo(rect.width-24,y+12);ctx.stroke();}
        ctx.fillStyle='rgba(239,224,194,.82)';ctx.font='800 54px Georgia';ctx.textAlign='center';ctx.fillText('1441',rect.width/2,rect.height*.45);
        ctx.font='700 11px ui-monospace';ctx.letterSpacing='2px';ctx.fillText('REIBE DIE ZEIT FREI',rect.width/2,rect.height*.49);
        ctx.globalCompositeOperation='destination-out';
        ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=112;
        ctx.beginPath();ctx.moveTo(72,152);ctx.bezierCurveTo(118,288,264,390,320,610);ctx.stroke();
        ctx.globalCompositeOperation='source-over';
      };
      drawCover();
      let scratching=false, strokes=24;
      const scratch = e => {
        if(!scratching) return;
        const r=canvas.getBoundingClientRect(); const x=e.clientX-r.left; const y=e.clientY-r.top;
        ctx.globalCompositeOperation='destination-out';
        const g=ctx.createRadialGradient(x,y,5,x,y,36);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,38,0,Math.PI*2);ctx.fill();
        strokes=Math.min(100,strokes+2); const label=stage.querySelector('.scratch-progress'); if(label) label.textContent=`Oberfläche ${strokes} % geöffnet`;
      };
      canvas.addEventListener('pointerdown',e=>{scratching=true;canvas.setPointerCapture(e.pointerId);scratch(e)});
      canvas.addEventListener('pointermove',scratch);
      canvas.addEventListener('pointerup',()=>scratching=false);
      stage.querySelector('[data-scratch-reveal]')?.addEventListener('click',()=>{ctx.clearRect(0,0,canvas.width,canvas.height);stage.querySelector('.scratch-progress').textContent='Oberfläche vollständig geöffnet';});

    function wireSwipe() {

      const reveal=()=>{el.classList.add('launched');stage.querySelector('.trailer-outcome')?.classList.add('revealed');const copy=stage.querySelector('#trailerCopy');if(copy)copy.textContent='Zug verstanden. Der erste Tisch ist offen.'};
      el.addEventListener('pointerdown',e=>{dragging=true;start=e.clientX;el.setPointerCapture(e.pointerId)});

      let timer;
      const cancel=()=>{clearTimeout(timer);el.classList.remove('holding')};
      const start=()=>{el.classList.add('holding');timer=setTimeout(()=>{el.classList.remove('holding');el.querySelector('span:last-child').textContent='Poch versiegelt ✓';el.disabled=true;stage.querySelector('#holdStatus').textContent='2 Chips gebunden · Gegner entscheiden.'},reducedMotion?20:900)};
      el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);start()}); el.addEventListener('pointerup',cancel); el.addEventListener('pointercancel',cancel); el.addEventListener('pointerleave',cancel);
    }

    function wireStage() {
      wireScratch(); wireSwipe(); wireHold();
      stage.querySelectorAll('[data-reset]').forEach(el=>el.addEventListener('click',()=>mount(current)));
      stage.querySelectorAll('[data-knock]').forEach(el=>el.addEventListener('click',()=>{el.classList.toggle('done');const n=stage.querySelectorAll('.knock.done').length;stage.querySelector('#knockCopy').textContent=n===4?'Der vierte Schlag öffnet den heutigen Tisch.':`${n} von 4 Materialschlägen gesetzt.`}));
      stage.querySelectorAll('[data-portrait]').forEach(el=>el.addEventListener('click',()=>{el.classList.toggle('awake');const n=stage.querySelectorAll('.living-portrait.awake').length;stage.querySelector('#portraitCopy').textContent=n?`${n} Mitspieler ${n===1?'antwortet':'antworten'} auf deinen Kontakt.`:'Berühre ein Porträt. Haltung und Reaktion ersetzen den üblichen Tutorial-Text.'}));
      stage.querySelector('[data-era-slider]')?.addEventListener('input',e=>{const eras=['1441','1900','2026','next'];const labels=['1441','1900','2026','Danach'];stage.querySelector('.jump-world').dataset.era=eras[e.target.value];stage.querySelector('#eraOutput').textContent=labels[e.target.value]});
      stage.querySelectorAll('[data-star], [data-meld-card]').forEach(el=>el.addEventListener('click',()=>el.classList.toggle('selected')));
      stage.querySelector('[data-layer-slider]')?.addEventListener('input',e=>{const copy=[['Ebene 1 · Hand','7♦, 8♦ und 9♦ sind verbunden.'],['Ebene 2 · Kombination','Die Folge ist vollständig und bleibt in der Hand.'],['Ebene 3 · Auszahlung','Vier Chips lösen sich aus dem Regelspeicher.']][e.target.value-1];stage.querySelector('.layers-stage').dataset.lift=e.target.value;stage.querySelector('#layerTitle').textContent=copy[0];stage.querySelector('#layerCopy').textContent=copy[1]});
      stage.querySelectorAll('[data-evidence]').forEach(el=>el.addEventListener('click',()=>{if(el.textContent.includes('Nicht vorhanden'))return;el.classList.toggle('marked');const n=stage.querySelectorAll('.evidence-slot.marked').length;stage.querySelector('#receipt').textContent=`${n} BELEGE MARKIERT · ${[0,3,8,12][n]} CHIPS`}));
      stage.querySelectorAll('[data-theatre]').forEach(el=>el.addEventListener('click',()=>{const d={king:['König · 3 Chips',staticCard('K','♦'),'Einzelmeldung, sofort lesbar.'],marriage:['Hochzeit · 8 Chips',`<div style="display:flex;justify-content:center">${staticCard('K','♦')}${staticCard('Q','♦')}</div>`,'Zwei Karten treten als Paar ins Licht.'],sequence:['Folge · 4 Chips',`<div style="display:flex;justify-content:center">${staticCard('7','♦')}${staticCard('8','♦')}${staticCard('9','♦')}</div>`,'Die Kartenfolge wird als Rhythmus gelesen.']}[el.dataset.theatre];stage.querySelector('#theatreTitle').textContent=d[0];stage.querySelector('#theatreCard').innerHTML=d[1];stage.querySelector('#theatreCopy').textContent=d[2]}));
      stage.querySelector('[data-lens-slider]')?.addEventListener('input',e=>{const p=e.target.value;stage.querySelector('.lens-pane.payout').style.clipPath=`inset(0 0 0 ${p}%)`;stage.querySelector('.lens-divider').style.left=`${p}%`;stage.querySelector('.lens-knob').style.left=`calc(${p}% - 23px)`});
      let pressure=38,pot=6;
      stage.querySelector('[data-raise]')?.addEventListener('click',()=>{pressure=Math.min(96,pressure+18);pot+=1;stage.querySelector('.pressure-meter span').style.transform=`scaleX(${pressure/100})`;stage.querySelector('.pressure-copy .eyebrow').textContent=`Druck ${pressure} %`;stage.querySelector('#pressureTitle').textContent=pressure>70?'Noahs Blick bricht zuerst.':'Noah hält dagegen.';stage.querySelector('#pressureCopy').textContent=`Pott ${pot} · nächster Schritt kostet ${Math.ceil(pot/4)}.`});
      stage.querySelectorAll('[data-fold]').forEach(el=>el.addEventListener('click',()=>{el.textContent='Gepasst ✓';el.disabled=true}));
      stage.querySelector('[data-duel-call]')?.addEventListener('click',e=>{const p=stage.querySelector('#duelPot');p.textContent=Number(p.textContent)+2;e.target.textContent='Hana entscheidet';stage.querySelector('.duel-face.left').classList.remove('active');stage.querySelector('.duel-face.right').classList.add('active')});
      stage.querySelector('[data-orbit]')?.addEventListener('input',e=>{stage.querySelector('#orbitBid').textContent=e.target.value==0?'passt':e.target.value;stage.querySelector('#orbitPot').textContent=6+Number(e.target.value)});
      stage.querySelectorAll('[data-glass-bid]').forEach(el=>el.addEventListener('click',()=>{stage.querySelectorAll('.glass-bid').forEach(x=>x.classList.remove('active'));el.classList.add('active');stage.querySelector('#stackTitle').textContent=`${el.dataset.glassBid}s Lage · 2 Chips`;stage.querySelector('#stackCopy').textContent=el.dataset.glassBid==='Du'?'Mitgehen bindet deinen bisherigen und zwei neue Chips.':'Diese Zusage bleibt sichtbar, bis der Pott entschieden ist.'}));
      stage.querySelector('[data-runway]')?.addEventListener('click',e=>{const cards=[...stage.querySelectorAll('.run-card')];const target=cards.find(x=>!x.classList.contains('played'));if(target)target.classList.add('played');const left=cards.filter(x=>!x.classList.contains('played')).length;e.target.textContent=left?`${left} Karten auf der Bahn`:'Reihe geschlossen ✓'});
      let timeline=2;
      const updateTimeline=()=>{const events=[...stage.querySelectorAll('.timeline-event')];events.forEach((el,i)=>{el.classList.toggle('done',i<timeline);el.classList.toggle('current',i===timeline)});const ranks=['7','8','9','10','J','Q'];stage.querySelector('#timelineTitle').textContent=timeline<6?`${ranks[timeline]}♣ ist als Nächstes erlaubt.`:'Kreuz-Reihe geschlossen.';const b=stage.querySelector('[data-timeline-next]');b.textContent=timeline<6?`${ranks[timeline]}♣ legen`:'Fertig ✓';b.disabled=timeline>=6};
      stage.querySelector('[data-timeline-next]')?.addEventListener('click',()=>{timeline=Math.min(6,timeline+1);updateTimeline()});stage.querySelector('[data-timeline-back]')?.addEventListener('click',()=>{timeline=Math.max(0,timeline-1);updateTimeline()});
      stage.querySelector('[data-collapse]')?.addEventListener('click',e=>{stage.querySelector('.collapse-stage').classList.toggle('open');e.target.textContent=stage.querySelector('.collapse-stage').classList.contains('open')?'10♣ in die Linie spielen':'Brett in Wege öffnen'});
      stage.querySelector('[data-spotlight-card]')?.addEventListener('click',e=>{e.currentTarget.classList.add('played');stage.querySelector('#spotlightTitle').textContent='10♣ liegt. Noah hat jetzt das Anspielrecht.'});
      let relay=1;stage.querySelector('[data-relay]')?.addEventListener('click',()=>{relay=relay%4+1;const s=stage.querySelector('.relay-stage');s.dataset.seat=relay;s.querySelectorAll('.relay-seat').forEach(el=>el.classList.toggle('active',Number(el.dataset.relaySeat)===relay))});
      stage.querySelectorAll('[data-scene-action]').forEach(el=>el.addEventListener('click',()=>{
        const state=stage.querySelector('.scene-state');
        if(state) state.textContent=el.dataset.state;
        el.textContent=el.dataset.done || 'Gesetzt ✓';
        el.closest('.cinematic')?.classList.add('scene-confirmed');
      }));
      stage.querySelectorAll('[data-scene-option]').forEach(el=>el.addEventListener('click',()=>{
        const exclusive=el.closest('.scene-mini-options');
        exclusive?.querySelectorAll('[data-scene-option]').forEach(option=>option.classList.remove('selected'));
        el.classList.add('selected');
        const state=stage.querySelector('.scene-state');
        if(state) state.textContent=el.dataset.state;
      }));
      stage.querySelectorAll('[data-scene-range]').forEach(el=>el.addEventListener('input',()=>{
        const output=stage.querySelector('[data-scene-output]');
        const value=Number(el.value);
        if(!output) return;
        if(chapter===0) output.textContent=['1441','1900','2026','danach'][value];
        else if(chapter===1 && current===1) output.textContent=`Ebene ${value} · ${['Hand','Kombination','Auszahlung'][value-1]}`;
        else if(chapter===1 && current===4) output.textContent=`${value} % Hand · ${100-value} % Wirkung`;
        else if(chapter===2 && current===3) output.textContent=value===0?'passen':`${value} Spielstein${value===1?'':'e'} · ${value<2?'prüfend':'offensiv'}`;
      }));
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    chapterTabs.forEach((el, i) => el.addEventListener('click', () => setChapter(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= chapters[chapter].variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % chapters[chapter].variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + chapters[chapter].variants.length) % chapters[chapter].variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    current = Math.max(0, Math.min(4, (parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1));
    chapterTabs.forEach((el, j) => el.setAttribute('aria-selected', j === chapter ? 'true' : 'false'));
    setActive(current);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
