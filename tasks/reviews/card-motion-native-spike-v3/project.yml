name: CardMotionNativeSpikeV3
options:
  bundleIdPrefix: com.tobc.reviews
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  CardMotionNativeSpikeV3:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobc.reviews.card-motion-native-spike-v3
        PRODUCT_NAME: CardMotionNativeSpikeV3
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Card Motion Native V3
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
  CardMotionNativeSpikeV3Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CardMotionNativeSpikeV3
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobc.reviews.card-motion-native-spike-v3.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  CardMotionNativeSpikeV3:
    build:
      targets:
        CardMotionNativeSpikeV3: all
        CardMotionNativeSpikeV3Tests: [test]
    test:
      targets:
        - CardMotionNativeSpikeV3Tests
    run:
      config: Debug
