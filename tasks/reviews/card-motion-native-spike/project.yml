name: CardMotionNativeSpike
options:
  bundleIdPrefix: com.tobc.reviews
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
targets:
  CardMotionNativeSpike:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobc.reviews.card-motion-native-spike
        PRODUCT_NAME: CardMotionNativeSpike
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Card Motion Spike
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGNING_ALLOWED: NO
  CardMotionNativeSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CardMotionNativeSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tobc.reviews.card-motion-native-spike.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  CardMotionNativeSpike:
    build:
      targets:
        CardMotionNativeSpike: all
        CardMotionNativeSpikeTests: [test]
    test:
      targets:
        - CardMotionNativeSpikeTests
    run:
      config: Debug
